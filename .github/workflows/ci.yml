name: ci
on:
  push: {}
  pull_request: {}
permissions: { contents: read }
jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -t . -v
      # Stingward audits itself: the repo must stay free of high and critical findings.
      - run: python -m stingward --lang en --fail-on high --offline

  online:
    name: tests against OSV, KEV, EPSS and NVD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: python -m pip install coverage
      - name: Tests with coverage (the README promises more than 90%)
        run: |
          python -m coverage run --source=stingward -m unittest discover -s tests -t . -v
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under=90
        env: { STINGWARD_ONLINE: "1" }

  package:
    name: packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Python wheel installs and runs
        shell: bash
        run: |
          python -m pip install build
          python -m build
          STINGWARD_DIST=dist python -m unittest tests.test_e2e.Packaging -v
          python -m pip install dist/*.whl
          stingward --version
          stingward --offline --fail-on never --format json > report.json
          python -c "import json; d = json.load(open('report.json')); assert d['tool'] == 'stingward', d"
      - name: npm package installs and runs
        shell: bash
        run: |
          sh scripts/build-npm.sh
          cd npm && npm pack && npm install -g ./stingward-*.tgz && cd ..
          bin="$(npm root -g)/stingward/bin/stingward.js"
          node "$bin" --version
          node "$bin" skill skills/stingward --offline --fail-on high
      - name: Plugin skill launcher runs
        shell: bash
        run: python skills/stingward/scripts/run.py --version

  plugin:
    name: Claude Code plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npx -y @anthropic-ai/claude-code@2.1.290 plugin validate .

  action:
    name: GitHub Action on sample projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sample projects (generated here so the repo never holds vulnerable lockfiles)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/clean" "$RUNNER_TEMP/bad"
          echo 'print("hello")' > "$RUNNER_TEMP/clean/app.py"
          k="sk-ant-""api03-Q7wErTy8UiOp2AsDfGh5JkLzXcVbNm1234567890abcd"  # fake key, split so the repo holds no literal
          printf 'const client = "%s";\n' "$k" > "$RUNNER_TEMP/bad/index.js"
          printf '{"mcpServers":{"remote":{"command":"npx","args":["mcp-remote@0.1.15","https://example.com/sse"]}}}\n' > "$RUNNER_TEMP/bad/.mcp.json"
      - id: clean
        uses: ./
        with: { path: "${{ runner.temp }}/clean", comment: "false", sarif: "false" }
      - id: bad
        uses: ./
        continue-on-error: true
        with: { path: "${{ runner.temp }}/bad", comment: "false", sarif: "false", fail-on: high }
      - name: Check the Action results
        shell: bash
        run: |
          echo "clean=${{ steps.clean.outputs.grade }} bad=${{ steps.bad.outputs.grade }} bad_outcome=${{ steps.bad.outcome }}"
          [ "${{ steps.clean.outputs.grade }}" = "A" ]
          [ "${{ steps.bad.outputs.grade }}" = "F" ]
          [ "${{ steps.bad.outcome }}" = "failure" ]
