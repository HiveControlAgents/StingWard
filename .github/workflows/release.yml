# Push a tag like v0.1.1 to publish to PyPI and npm and to move the v0 tag used by the Action.
name: release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - id: v
        name: Tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for got in \
            "$(python -c 'import stingward; print(stingward.__version__)')" \
            "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" \
            "$(python -c 'import json; print(json.load(open("npm/package.json"))["version"])')" \
            "$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"; do
            [ "$got" = "$tag" ] || { echo "version $got does not match tag $tag"; exit 1; }
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s tests -t .

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/stingward/" }
    permissions: { id-token: write }  # PyPI trusted publishing, no token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: check
    runs-on: ubuntu-latest
    environment: { name: npm, url: "https://www.npmjs.com/package/stingward" }
    permissions: { id-token: write }  # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest  # trusted publishing needs npm 11.5.1+
      - run: sh scripts/build-npm.sh
      # First release: set the NPM_TOKEN secret. After it, configure trusted publishing on npmjs.com and delete the secret.
      - run: npm publish --provenance --access public
        working-directory: npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  github:
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Move the v0 tag that the Action examples use
        run: git tag -f v0 && git push -f origin v0
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Stingward $GITHUB_REF_NAME"
