# Publishes when CI passes on main and the version in the code has no release yet.
# Every job checks whether its own target already has this version, so re-running it only fills in what is missing.
name: release
on:
  workflow_run: { workflows: [ci], types: [completed], branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - id: v
        name: Every version field agrees
        run: |
          v="$(python -c 'import stingward; print(stingward.__version__)')"
          for got in \
            "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" \
            "$(python -c 'import json; print(json.load(open("npm/package.json"))["version"])')" \
            "$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"; do
            [ "$got" = "$v" ] || { echo "version $got does not match stingward.__version__ $v"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/stingward/" }
    permissions: { id-token: write }  # PyPI trusted publishing, no token stored
    steps:
      - id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/stingward/${{ needs.check.outputs.version }}/json")
          echo "skip=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.skip == 'false'
        uses: actions/checkout@v7
        with: { ref: "${{ needs.check.outputs.sha }}" }
      - if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - if: steps.exists.outputs.skip == 'false'
        run: python -m pip install build && python -m build
      - if: steps.exists.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: check
    runs-on: ubuntu-latest
    environment: { name: npm, url: "https://www.npmjs.com/package/stingward" }
    permissions: { id-token: write }  # npm provenance and trusted publishing
    steps:
      - id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/stingward/${{ needs.check.outputs.version }}")
          echo "skip=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.skip == 'false'
        uses: actions/checkout@v7
        with: { ref: "${{ needs.check.outputs.sha }}" }
      - if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - if: steps.exists.outputs.skip == 'false'
        run: npm install -g npm@11.21.0  # trusted publishing needs npm 11.5.1+; exact, since this job holds id-token
      - if: steps.exists.outputs.skip == 'false'
        run: sh scripts/build-npm.sh
      # Trusted publishing on npmjs.com (HiveControlAgents/StingWard, release.yml, environment npm): no token stored.
      - if: steps.exists.outputs.skip == 'false'
        run: npm publish --provenance --access public
        working-directory: npm

  github:
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.check.outputs.sha }}", fetch-depth: 0 }
      - name: Tag the version and move v0, the tag the Action examples use
        env: { V: "v${{ needs.check.outputs.version }}" }
        run: |
          git rev-parse -q --verify "refs/tags/$V" >/dev/null || { git tag "$V" && git push origin "$V"; }
          git tag -f v0 "$V" && git push -f origin v0
      - name: GitHub release, with this version's CHANGELOG entry as its notes
        env: { GH_TOKEN: "${{ github.token }}", V: "v${{ needs.check.outputs.version }}" }
        run: |
          gh release view "$V" >/dev/null 2>&1 && exit 0
          # Relative links in the changelog would break on the release page, so they point at the tagged files.
          awk -v h="## [${V#v}]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md \
            | sed -E "s#\]\(([^):#]+)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$V/\1)#g" > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no entry for ${V#v}"; exit 1; }
          gh release create "$V" --title "Stingward $V" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
