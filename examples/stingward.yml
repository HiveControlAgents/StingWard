# Copy to .github/workflows/stingward.yml
name: stingward
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # new CVEs come out every day: re-check even without new commits

permissions:
  contents: read
  pull-requests: write     # PR comment
  security-events: write   # code scanning (SARIF)
  # actions: read          # uncomment in a private repository: the SARIF upload needs it too

jobs:
  stingward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: HiveControlAgents/StingWard@v0
        with:
          lang: pt
          fail-on: high
